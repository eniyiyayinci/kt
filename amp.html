<html ⚡ lang="tr">
<head>

  <title>Taraftarium24 - Canlı Maç İzle | Ücretsiz HD Spor Yayınları</title>
  <meta name="description" content="Taraftarium24 ile canlı maç izle. Türkiye'nin en güvenilir ücretsiz HD spor yayın platformu. Taraftarium 24 ve Taraftarium ile kesintisiz futbol keyfi." />
  <link rel="canonical" href="https://taraftariumgir.is/" />

  <style amp-boilerplate>body{-webkit-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-moz-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-ms-animation:-amp-start 8s steps(1,end) 0s 1 normal both;animation:-amp-start 8s steps(1,end) 0s 1 normal both}@-webkit-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-moz-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-ms-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}</style>
  <noscript><style amp-boilerplate>body{-webkit-animation:none;-moz-animation:none;-ms-animation:none;animation:none}</style></noscript>

  <script async src="https://cdn.ampproject.org/v0.js"></script>
  <script async custom-element="amp-analytics" src="https://cdn.ampproject.org/v0/amp-analytics-0.1.js"></script>

  <style amp-custom>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #060810;
      color: #e4e4e4;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        rgba(6,8,16,0.75) 0%,
        rgba(6,8,16,0.55) 40%,
        rgba(6,8,16,0.80) 100%);
      z-index: 1;
    }

    .hero-glow {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 360px;
      background: radial-gradient(ellipse at center, rgba(212,165,32,0.20) 0%, transparent 68%);
      z-index: 1;
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 48px;
      gap: 20px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,55,55,0.14);
      border: 1px solid rgba(255,55,55,0.32);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 700;
      color: #ff6b6b;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #ff4444;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .logo {
      display: block;
      text-decoration: none;
      line-height: 0;
      margin-bottom: 16px;
    }

    .logo amp-img {
      mix-blend-mode: screen;
      filter: drop-shadow(0 4px 28px rgba(212,165,32,0.5));
    }

    nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 480px;
    }

    nav a {
      padding: 14px 30px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.2px;
      white-space: nowrap;
      text-align: center;
    }

    nav a.primary {
      background: linear-gradient(135deg, #D4A520 0%, #EFC040 100%);
      color: #0d0d0d;
      box-shadow: 0 4px 22px rgba(212,165,32,0.45);
    }

    nav a.secondary {
      background: rgba(255,255,255,0.07);
      color: #ddd;
      border: 1px solid rgba(255,255,255,0.13);
    }

    footer {
      text-align: center;
      padding: 22px 16px;
      border-top: 1px solid rgba(212,165,32,0.1);
    }

    .footer-logo { line-height: 0; margin-bottom: 8px; }
    .footer-logo amp-img { mix-blend-mode: screen; opacity: 0.8; }
    footer p { color: #444; font-size: 11.5px; }

    @media (max-width: 768px) {
      .hero-inner { padding: 40px 16px 40px; gap: 18px; }
      .logo { margin-bottom: 12px; }
      nav { max-width: 400px; gap: 10px; }
      nav a { padding: 13px 24px; font-size: 14px; }
    }

    @media (max-width: 520px) {
      .hero-inner { padding: 32px 16px 32px; gap: 16px; }
      .logo { margin-bottom: 10px; }
      nav {
        flex-direction: column;
        align-items: stretch;
        max-width: 320px;
        gap: 10px;
      }
      nav a {
        padding: 15px 20px;
        font-size: 14px;
        border-radius: 10px;
        width: 100%;
      }
    }
  </style>
</head>
<body>

      "vars": {

          "G-L5L8LCKEZE": { "groups": "default" }
        }

    }
    </script>
  </amp-analytics>

  <div class="hero">
    <div class="hero-bg">
      <amp-img
        src="https://images.unsplash.com/photo-1529900748604-07564a03e7a6?w=1600&q=80"
        layout="fill"
        object-fit="cover"
        alt="Canlı maç izle - Taraftarium24"
      ></amp-img>
    </div>

    <div class="hero-inner">

        <span class="live-dot"></span>
        Canlı Yayındayız
      </div>

      <a href="#" class="logo">
        <amp-img
          src="logo.png"
          width="280"
          height="70"
          layout="fixed"
          alt="Taraftarium24 - Canlı Maç İzle"
        ></amp-img>
      </a>

      <nav>
        <a href="https://t.co/6vPuUxO91F" class="primary">Canlı Maç Girişi</a>
        <a href="https://x.com/TRSportHD" class="secondary">Twitter</a>
        <a href="https://t.me/patronbahis" class="secondary">Telegram Grubu</a>
        <a href="https://cutt.ly/patrontv" class="secondary">iPTV Satın Al</a>
        <a href="https://cutt.ly/ptyIE6nD" class="secondary">Android Uygulama Indir</a>
      </nav>
    </div>
  </div>

  <footer>
    <div class="footer-logo">
      <amp-img
        src="logo.png"
        width="120"
        height="30"
        layout="fixed"
        alt="Taraftarium24"
      ></amp-img>
    </div>
    <p>&copy; 2026 Taraftarium24 — Tüm hakları saklıdır.</p>
  </footer>

</body>
</html>
